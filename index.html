<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiruvalluvar Voice AI</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --chat-bg: #1e293b;
            --primary: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --user-msg: #2563eb;
            --bot-msg: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 90vh;
            background: var(--chat-bg);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #334155;
        }

        .header {
            padding: 20px;
            background: rgba(30, 41, 59, 0.9);
            border-bottom: 1px solid #334155;
            text-align: center;
            backdrop-filter: blur(10px);
        }
        
        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--primary);
        }

        .messages {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
        }

        .message.user {
            align-self: flex-end;
            background: var(--user-msg);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            align-self: flex-start;
            background: var(--bot-msg);
            border-bottom-left-radius: 4px;
        }

        .audio-player {
            margin-top: 10px;
            width: 100%;
            height: 30px;
        }

        .input-area {
            padding: 15px 20px;
            background: var(--chat-bg);
            border-top: 1px solid #334155;
            display: flex;
            gap: 10px;
        }

        input {
            flex-grow: 1;
            background: #0f172a;
            border: 1px solid #334155;
            padding: 12px 16px;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        
        input:focus {
            border-color: var(--primary);
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: background 0.2s;
        }

        button:hover {
            background: #2563eb;
        }
        
        button:disabled {
            background: #475569;
            cursor: not-allowed;
        }

        .typing {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-style: italic;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">
        <h1>Thiruvalluvar Voice AI</h1>
    </div>
    
    <div class="messages" id="messages">
        <div class="message bot">
            வணக்கம்! திருக்குறள் பற்றி என்ன கேட்க விரும்புகிறீர்கள்? (e.g., "101வது குறள் என்ன?")
        </div>
    </div>
    
    <div class="input-area">
        <input type="text" id="queryInput" placeholder="Enter your question in Tamil..." autocomplete="off" onkeypress="handleEnter(event)">
        <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    const messages = document.getElementById('messages');
    const input = document.getElementById('queryInput');
    const sendBtn = document.getElementById('sendBtn');
    
    function appendMessage(text, isUser = false, audioBlob = null) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${isUser ? 'user' : 'bot'}`;
        msgDiv.innerText = text;
        
        if (audioBlob) {
            const audioUrl = URL.createObjectURL(audioBlob);
            const audio = document.createElement('audio');
            audio.controls = true;
            audio.autoplay = true;
            audio.className = 'audio-player';
            audio.src = audioUrl;
            msgDiv.appendChild(audio);
        }
        
        messages.appendChild(msgDiv);
        messages.scrollTop = messages.scrollHeight;
    }

    function appendTyping() {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message bot typing`;
        msgDiv.id = 'typingIndicator';
        msgDiv.innerText = "சிந்திக்கிறது... (Thinking...)";
        messages.appendChild(msgDiv);
        messages.scrollTop = messages.scrollHeight;
    }

    function removeTyping() {
        const typing = document.getElementById('typingIndicator');
        if (typing) typing.remove();
    }

    async function sendMessage() {
        const text = input.value.trim();
        if (!text) return;
        
        // 1. Show User Message
        appendMessage(text, true);
        input.value = '';
        input.disabled = true;
        sendBtn.disabled = true;
        
        appendTyping();
        
        try {
            // 2. Query Knowledge Backend
            const knowledgeRes = await fetch('http://localhost:3000/api/v1/knowledge/query', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text })
            });
            
            const knowledgeData = await knowledgeRes.json();
            const answer = knowledgeData.answer?.explanation || "மன்னிக்கவும், எனக்குப் புரியவில்லை.";
            
            // 3. Request TTS Audio
            const ttsRes = await fetch('http://localhost:3000/api/v1/tts/synthesize', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: answer })
            });
            
            const audioBlob = await ttsRes.blob();
            
            removeTyping();
            
            // 4. Show Bot Message with Audio
            appendMessage(answer, false, audioBlob);
            
        } catch (error) {
            removeTyping();
            appendMessage("Error: Could not connect to backend.", false);
            console.error(error);
        } finally {
            input.disabled = false;
            sendBtn.disabled = false;
            input.focus();
        }
    }

    function handleEnter(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    }
</script>

</body>
</html>
